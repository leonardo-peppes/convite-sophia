<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Convite da Sophia 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #ffc9de 0%, #ffb3d9 100%);
  font-family: 'Quicksand', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* Container principal */
.container {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.titulo-topo {
  position: relative; /* Changed from absolute */
  top: auto;
  margin-bottom: 20px; /* Closer to envelope */
  text-align: center;
  width: 100%;
  font-family: 'Quicksand', sans-serif; /* Rounded font */
  font-weight: 700;
  text-transform: uppercase; /* Uppercase */
  font-size: 24px;
  color: #fff;
  text-shadow: 0 4px 15px rgba(255, 105, 180, 0.6);
  letter-spacing: 2px;
  transition: opacity 0.5s ease;
}

.titulo-topo.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Envelope */
.envelope-container {
  position: relative;
  width: 100%;
  max-width: 400px;
  perspective: 1000px;
  cursor: pointer;
  transition: transform 0.3s;
}

.envelope-container:active {
  transform: scale(0.98);
}

.envelope-container.opened {
  cursor: default;
  pointer-events: none;
}

.envelope-image {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(255, 105, 180, 0.4);
  transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.envelope-container.opened .envelope-image {
  transform: translateY(-150%) scale(0.3);
  opacity: 0;
}

/* Indicador de clique */
.click-indicator {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  text-shadow: 0 2px 10px rgba(255, 105, 180, 0.5);
  animation: pulse 2s infinite;
  opacity: 1;
  transition: opacity 0.5s;
  text-align: center;
  white-space: nowrap;
}

.envelope-container.opened .click-indicator {
  opacity: 0;
}

@keyframes pulse {
  0%, 100% { 
    opacity: 0.7;
    transform: translateX(-50%) translateY(0);
  }
  50% { 
    opacity: 1;
    transform: translateX(-50%) translateY(-5px);
  }
}

/* Convite */
.invitation {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  width: 90%;
  max-width: 380px;
  background: white;
  border-radius: 25px;
  padding: 35px 25px;
  box-shadow: 0 20px 60px rgba(255, 105, 180, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  border: 4px solid #ffb3d9;
  z-index: 100;
}

.envelope-container.opened ~ .invitation {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: all;
}

.invitation-header {
  font-family: 'Pacifico', cursive;
  font-size: 26px;
  color: #ff69b4;
  margin-bottom: 5px;
  text-align: center;
  line-height: 1.3;
}

.kitty-icon {
  font-size: 50px;
  text-align: center;
  margin: 15px 0;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.invitation-subtitle {
  font-size: 16px;
  color: #666;
  text-align: center;
  margin-bottom: 20px;
  line-height: 1.5;
}

.divider {
  width: 50px;
  height: 3px;
  background: linear-gradient(to right, #ff69b4, #ffc9e5);
  margin: 15px auto;
  border-radius: 2px;
}

.event-details {
  background: linear-gradient(135deg, #fff5f8, #ffe8f0);
  border-radius: 15px;
  padding: 18px;
  margin: 18px 0;
  border: 2px dashed #ffb3d9;
}

.detail-item {
  display: flex;
  align-items: center;
  margin: 10px 0;
  font-size: 15px;
  color: #555;
}

.detail-icon {
  font-size: 22px;
  margin-right: 10px;
  min-width: 28px;
}

.detail-text {
  font-weight: 600;
  color: #333;
  flex: 1;
}

.confirm-btn {
  width: 100%;
  background: linear-gradient(135deg, #ff69b4, #ff85c1);
  border: none;
  padding: 16px;
  font-size: 17px;
  font-weight: 700;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 20px;
  font-family: 'Quicksand', sans-serif;
  box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent;
}

.confirm-btn:active {
  transform: scale(0.97);
  box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
}

/* Confetes */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: #ff69b4;
  opacity: 0;
  z-index: 99;
  animation: confetti-fall 3s ease-out forwards;
}

@keyframes confetti-fall {
  0% {
    opacity: 1;
    transform: translateY(-50px) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translateY(100vh) rotate(720deg);
  }
}

/* Corações de fundo */
.heart-bg {
  position: fixed;
  font-size: 25px;
  opacity: 0.15;
  animation: float 15s infinite ease-in-out;
  z-index: 0;
}

.kitty-bg {
  position: fixed;
  width: 40px;
  height: auto;
  opacity: 0.15;
  animation: float 15s infinite ease-in-out;
  z-index: 0;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-30px) rotate(10deg); }
}

/* Stories Overlay */
.stories-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
  z-index: 2000;
  transform: translateY(100%);
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  display: flex;
  flex-direction: column;
}

.stories-overlay.active {
  transform: translateY(0);
}

/* Progress Bars */
.progress-container {
  position: absolute;
  top: 15px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 5px;
  z-index: 2002;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #fff;
  transition: width 0.3s ease;
}

.progress-bar.completed .progress-fill {
  width: 100%;
}

.progress-bar.active .progress-fill {
  width: 100%;
}

/* Carousel Track */
.stories-track {
  display: flex;
  width: 300%; /* 3 stories */
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

.story {
  width: 100vw;
  height: 100%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  text-align: center;
  position: relative;
  color: #fff;
}

/* Story Content Styles */
.story-title {
  font-family: 'Pacifico', cursive;
  font-size: 36px;
  margin-bottom: 30px;
  text-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.story-content {
  font-size: 20px;
  line-height: 1.8;
  background: rgba(255, 255, 255, 0.9);
  padding: 30px;
  border-radius: 20px;
  color: #ff69b4;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 350px;
}

.story-item {
  margin: 15px 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
}

.story-icon {
  font-size: 28px;
  margin-right: 15px;
  min-width: 35px;
  text-align: center;
}

/* Hide old invitation popup effectively */
.envelope-container.opened ~ .invitation {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Helper for navigation */
.nav-hint {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 30px;
  color: rgba(255,255,255,0.6);
  pointer-events: none;
}
.nav-left { left: 10px; }
.nav-right { right: 10px; }

</style>
</head>

<body>

<!-- Elementos de fundo -->
<div class="heart-bg" style="top: 5%; left: 10%;">💗</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="top: 12%; left: 30%; animation-delay: 1s;">
<div class="heart-bg" style="top: 15%; right: 15%; animation-delay: 2s;">💖</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="top: 25%; left: 5%; animation-delay: 1.5s;">
<div class="heart-bg" style="bottom: 20%; left: 20%; animation-delay: 4s;">💕</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="bottom: 30%; right: 30%; animation-delay: 2.5s;">
<div class="heart-bg" style="bottom: 10%; right: 10%; animation-delay: 1s;">💝</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="top: 45%; right: 5%; animation-delay: 3.5s;">
<div class="heart-bg" style="top: 50%; left: 5%; animation-delay: 3s;">🎀</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="bottom: 50%; left: 50%; animation-delay: 0.5s;">
<div class="heart-bg" style="top: 60%; right: 5%; animation-delay: 5s;">🎀</div>
<img src="imagens/kitty3.png" class="kitty-bg" style="top: 80%; left: 80%; animation-delay: 4.5s;">

<div class="container">
  <div class="titulo-topo" id="mainTitle">
    Aniversário da Sophia Ramos
  </div>
  <div class="envelope-container" id="envelopeContainer">
    <img src="imagens/envelope.png" alt="Envelope da Sophia" class="envelope-image">
  </div>
  
  <!-- Old Invitation div remains but hidden via CSS -->
  <div class="invitation">
    <div class="kitty-icon">😺</div>
    <div class="invitation-header">Sophia faz 9 anos!</div>
     <!-- ... content ... -->
    <button class="confirm-btn" onclick="confirmarPresenca()">Confirmar Presença 💖</button>
  </div>
</div>

<!-- Stories Overlay Structure -->
<div class="stories-overlay" id="storiesOverlay">
  
  <div class="progress-container">
    <div class="progress-bar" id="bar0"><div class="progress-fill"></div></div>
    <div class="progress-bar" id="bar1"><div class="progress-fill"></div></div>
    <div class="progress-bar" id="bar2"><div class="progress-fill"></div></div>
  </div>

  <div class="stories-track" id="storiesTrack">
    
    <!-- Story 1 -->
    <div class="story">
      <div class="story-title">Data e Local</div>
      <div class="story-content">
        <div class="story-item">
          <span class="story-icon">📅</span> 07 de Março
        </div>
        <div class="story-item">
          <span class="story-icon">⏰</span> 13h00
        </div>
        <div class="story-item">
          <span class="story-icon">📍</span> Rua Major Theolindo Ferreira Ribas, 2977
        </div>
      </div>
      <div class="kitty-icon" style="font-size: 80px; margin-top: 30px;">🏠</div>
    </div>

    <!-- Story 2 -->
    <div class="story">
      <div class="story-title">Programação</div>
      <div class="story-content">
        <div class="story-item"><span class="story-icon">🎈</span> Recepção</div>
        <div class="story-item"><span class="story-icon">🎂</span> Hora do bolo</div>
        <div class="story-item"><span class="story-icon">🎉</span> Brincadeiras</div>
        <div class="story-item"><span class="story-icon">📸</span> Fotos</div>
      </div>
       <div class="kitty-icon" style="font-size: 80px; margin-top: 30px;">🍰</div>
    </div>

    <!-- Story 3 -->
    <div class="story">
      <div class="story-title">Traje da Festa</div>
      <div class="story-content">
        <div class="story-item"><span class="story-icon">👗</span> Roupa confortável</div>
        <div class="story-item"><span class="story-icon">🎀</span> Algo rosa ou da Hello Kitty</div>
        
        <button class="confirm-btn" onclick="confirmarPresenca()" style="margin-top: 20px;">
          Confirmar Presença 💖
        </button>
      </div>
       <div class="kitty-icon" style="font-size: 80px; margin-top: 30px;">👒</div>
    </div>

  </div>
</div>

<script>
const envelopeContainer = document.getElementById('envelopeContainer');
const mainTitle = document.getElementById('mainTitle');
const storiesOverlay = document.getElementById('storiesOverlay');
const storiesTrack = document.getElementById('storiesTrack');
const totalStories = 3;
let currentStory = 0;
let opened = false;

// Abrir envelope ao tocar
envelopeContainer.addEventListener('click', function(e) {
  if (!opened) {
    opened = true;
    this.classList.add('opened');
    mainTitle.classList.add('hidden'); // Ocultar título
    createConfetti();
    
    // Mostrar stories após a animação do envelope
    setTimeout(() => {
        storiesOverlay.classList.add('active');
        updateStoriesUI();
    }, 800);
  }
});

// Navegação ao clicar nas bordas
storiesOverlay.addEventListener('click', function(e) {
    // Se clicar em botão ou link, não navega
    if (e.target.closest('button') || e.target.closest('a')) return;

    const screenWidth = window.innerWidth;
    const clickX = e.clientX;

    if (clickX > screenWidth / 2) {
        // Próximo
        if (currentStory < totalStories - 1) {
            currentStory++;
            updateStoriesUI();
        }
    } else {
        // Anterior
        if (currentStory > 0) {
            currentStory--;
            updateStoriesUI();
        }
    }
});

function updateStoriesUI() {
    // Mover o track
    // width track = 300vw. story = 100vw.
    // translate 0 -> 0vw
    // translate 1 -> -100vw
    // translate 2 -> -200vw
    storiesTrack.style.transform = `translateX(-${currentStory * 100}vw)`;

    // Atualizar barras
    for (let i = 0; i < totalStories; i++) {
        const bar = document.getElementById(`bar${i}`);
        const fill = bar.querySelector('.progress-fill');
        
        // Lógica simples: Se o story atual >= indice da barra, ela está cheia.
        // Se story atual == indice, ela está cheia (ativa).
        // Se story atual < indice, ela está vazia.
        if (currentStory >= i) {
            fill.style.width = '100%';
        } else {
            fill.style.width = '0%';
        }
    }
}

// Criar confetes
function createConfetti() {
  const colors = ['#ff69b4', '#ffc9e5', '#ffb3d9', '#ff85c1', '#ffa6d5', '#fff'];
  
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.top = '-50px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 0.3 + 's';
      confetti.style.width = Math.random() * 8 + 5 + 'px';
      confetti.style.height = confetti.style.width;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(confetti);
      
      setTimeout(() => confetti.remove(), 3000);
    }, i * 25);
  }
}

// Confirmar presença
function confirmarPresenca() {
  // Substitua SEUNUMERO pelo número de WhatsApp com código do país
  const mensagem = encodeURIComponent('Olá! Confirmo presença na festa da Sophia! 🎉💖');
  window.location.href = `https://wa.me/55SEUNUMERO?text=${mensagem}`;
}

// Prevenir zoom no iOS
document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});
</script>

</body>
</html>
